version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'ci'
      include: scope
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
      include: scope
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      storybook:
        patterns: ['storybook', '@storybook/*', 'eslint-plugin-storybook']
      vitest:
        patterns: ['vitest', '@vitest/*', 'vitest-browser-svelte', 'playwright']
      lint:
        patterns: ['eslint', '@eslint/*', 'eslint-*', 'typescript-eslint', 'prettier*', 'globals']
      dev-dependencies:
        patterns: ['*']
        exclude-patterns:
          - 'storybook'
          - '@storybook/*'
          - 'eslint-plugin-storybook'
          - 'vitest'
          - '@vitest/*'
          - 'vitest-browser-svelte'
          - 'playwright'
          - 'eslint'
          - '@eslint/*'
          - 'eslint-*'
          - 'typescript-eslint'
          - 'prettier*'
          - 'globals'
